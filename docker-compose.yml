version : '3.5'

services:
  main:
    build:
      context: ./main
      dockerfile: Dockerfile
    restart: unless-stopped
    # JVM 内存调优 - 避免 OOM
    entrypoint: ["java", "-Xms256m", "-Xmx512m", "-XX:+UseG1GC", "-XX:+HeapDumpOnOutOfMemoryError", "-jar", "./marsctf-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 1g
    mem_reservation: 512m
    oom_kill_disable: false
    volumes:
      - ./main/CTFFiles:/CTFFiles
      - ./main/CTFImages:/CTFImages
      - ./main/CertKey:/CertKey
      - ./main/log:/var/log/springboot
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "pidof", "java"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default:
      internal:
  db:
    image: mysql:8.0.15
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=marsdb
      - MYSQL_DATABASE=marsdb
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/sql/marsdb.sql:/docker-entrypoint-initdb.d/marsdb.sql
    privileged: true
    mem_limit: 512m
    mem_reservation: 256m
    oom_kill_disable: false
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "marsdb", "-pmarsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      internal:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 7991:80
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/log:/var/log/nginx
    privileged: true
    mem_limit: 128m
    mem_reservation: 64m
    oom_kill_disable: false
    depends_on:
      main:
        condition: service_started
    networks:
      default:
      internal:
  redis:
    image: redis:7.0.4
    expose:
      - "6379"
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    oom_kill_disable: false
    networks:
      internal:

networks:
    default:
    internal:
        internal: true
